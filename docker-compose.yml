# Sobe os dois microsserviços juntos: docker compose up --build
services:
  processing:
    build:
      context: .
      dockerfile: processing_service/Dockerfile
    container_name: galeria-processing
    ports:
      - "8002:8002"          # host:contêiner (útil para testar o /health)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  gallery:
    build:
      context: .
      dockerfile: gallery_service/Dockerfile
    container_name: galeria-gallery
    ports:
      - "8001:8001"
    environment:
      # Dentro da rede do Compose, um serviço acha o outro pelo NOME do serviço
      PROCESSING_URL: http://processing:8002
      STORAGE_ROOT: /app/storage
    volumes:
      # As imagens enviadas ficam na pasta storage/ do seu computador
      - ./storage:/app/storage
    depends_on:
      processing:
        condition: service_healthy   # só sobe depois que o Processamento estiver saudável
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped